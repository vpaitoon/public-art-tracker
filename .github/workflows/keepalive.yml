name: Keepalive (prevent schedule auto-disable)

# GitHub disables scheduled workflows on public repos after 60 days with no
# qualifying activity. The scanner's own github-actions[bot] commits do NOT
# count, so this job creates real activity every ~2 weeks and re-enables any
# scheduled workflow that was already turned off.

on:
  schedule:
    - cron: "0 12 */14 * *"   # every 14 days at 12:00 UTC
  workflow_dispatch: {}

permissions:
  actions: write
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep scheduled workflows alive
        uses: gautamkrishnar/keepalive-workflow@v2
        with:
          use_api: true   # re-enables workflows disabled due to inactivity
